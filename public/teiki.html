<title>定期テスト対策｜高校 古文・漢文</title>
<style>
:root {
  --bg: #EEF1F5; --card: #FFFFFF; --ink: #18212F; --muted: #566176; --line: #D3D9E3; --mark: #2A4FC4;
  --f-han: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111723; --card: #1A2231; --ink: #E7ECF4; --muted: #9AA5B9; --line: #2D3749; --mark: #8FA9FF; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); line-height: 1.75; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
.back { display: inline-block; text-decoration: none; color: var(--mark); font-weight: 700; padding: 6px 0; }
h1 { font-family: var(--f-han); font-size: 1.8rem; line-height: 1.35; margin: 10px 0 8px; }
.box { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
.box p { margin: 0 0 10px; }
.box a { color: var(--mark); font-weight: 700; }
</style>
</head>

</html>
