<style>
:root {
  --bg: #EEF1F5; --card: #FFFFFF; --ink: #18212F; --muted: #566176; --line: #D3D9E3; --mark: #2A4FC4; --mark-soft: #E1E8FB;
  --f-han: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111723; --card: #1A2231; --ink: #E7ECF4; --muted: #9AA5B9; --line: #2D3749; --mark: #8FA9FF; --mark-soft: #25314F; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); line-height: 1.75; }
.wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 48px; }
.back { display: inline-block; text-decoration: none; color: var(--mark); font-weight: 700; padding: 6px 0; }
h1 { font-family: var(--f-han); font-size: 1.8rem; line-height: 1.35; margin: 8px 0 6px; }
.lead { color: var(--muted); margin: 0 0 18px; }
h2 { font-family: var(--f-han); font-size: 1.15rem; margin: 26px 0 8px; }
a.card { display: block; text-decoration: none; color: inherit; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
a.card:hover, a.card:focus-visible { border-color: var(--mark); outline: none; }
a.card .tag { display: inline-block; font-size: .75rem; font-weight: 700; color: var(--mark); background: var(--mark-soft); border-radius: 999px; padding: 0 10px; }
a.card h3 { font-family: var(--f-han); font-size: 1.4rem; margin: 4px 0 0; }
a.card p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
a.card .go { display: block; margin-top: 6px; font-weight: 700; color: var(--mark); }
.soon { background: var(--card); border: 2px dashed var(--line); border-radius: 16px; padding: 12px 16px; color: var(--muted); font-size: .92rem; }
.links a { color: var(--mark); font-weight: 700; display: inline-block; margin: 2px 12px 2px 0; }
</style>
</head>
